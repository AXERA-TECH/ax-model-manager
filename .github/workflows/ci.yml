name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Test, package, and smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install -e backend

      - name: Check shell and Python syntax
        run: |
          set -euo pipefail
          bash -n scripts/*.sh
          python -m compileall backend/ax_model_manager backend/tests scripts

      - name: Reject conflict markers and whitespace errors
        run: |
          set -euo pipefail
          if grep -R -n -E '^(<<<<<<<|=======$|>>>>>>>)' \
            README.md RELEASES.md backend scripts docs .github/workflows; then
            echo "::error::Unresolved conflict markers found"
            exit 1
          fi
          git diff --check

      - name: Reject internal network addresses
        run: |
          set -euo pipefail
          if git grep -n -E \
            '(^|[^0-9])(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|169\.254\.[0-9]{1,3}\.[0-9]{1,3}|f[cd][0-9a-f]{2}:)' \
            -- . ':!package-lock.json'; then
            echo "::error::Internal IPv4/IPv6 address found in tracked source"
            exit 1
          fi

      - name: Reject internal engineering records
        run: |
          set -euo pipefail
          internal_docs="$(
            git ls-files 'docs/*' |
              grep -Ev '^docs/(skills|third-party-ui-integration|USER_GUIDE)\.md$' || true
          )"
          if [ -n "$internal_docs" ]; then
            echo "::error::Unexpected internal docs/ file must not be published: $internal_docs"
            exit 1
          fi
          if git grep -n -E '/mnt/tangqi|/home/[A-Za-z0-9_.-]+|qiushui|junda|tangqi' \
            -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Internal path or personal identifier found in tracked source"
            exit 1
          fi

      - name: Run tests
        run: pytest backend/tests -q

      - name: Build release archive
        run: ./scripts/package.sh

      - name: Smoke-test API and Web UI
        run: |
          set -euo pipefail
          ./scripts/create_fixtures.py fixtures/models/generated
          AX_MODEL_MANAGER_TOKEN=local-dev-token \
          AX_MODEL_MANAGER_MODEL_ROOT="$PWD/fixtures/models/generated" \
            uvicorn ax_model_manager.app:app \
            --app-dir backend \
            --host 127.0.0.1 \
            --port 18090 \
            > /tmp/ax-model-manager.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            health_body="$(curl --fail --silent http://127.0.0.1:18090/health || true)"
            if grep -q '"status":"ok"' <<<"$health_body"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::API server did not become ready"
            cat /tmp/ax-model-manager.log
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:18090/ -o /tmp/ax-model-manager-index.html
          curl --fail --silent http://127.0.0.1:18090/ui/app.js -o /tmp/ax-model-manager-app.js
          grep -q 'AXERA Model Manager' /tmp/ax-model-manager-index.html
          grep -q 'renderDeviceResources' /tmp/ax-model-manager-app.js
          AX_MODEL_MANAGER_TOKEN=local-dev-token \
            ./scripts/regression.sh http://127.0.0.1:18090

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: ax-model-manager-release
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
